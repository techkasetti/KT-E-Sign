<!-- riskScoreChart.html -->
<template>
    <lightning-card title="Fraud Risk Score Distribution" icon-name="utility:warning">
        <div class="slds-m-around_medium">
            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>

            <!-- Chart Canvas -->
            <template if:true={chartData}>
                <div class="chart-container" style="position: relative; height:300px;">
                    <canvas class="chart" lwc:dom="manual"></canvas>
                </div>
            </template>

            <!-- No Data Message -->
            <template if:true={isChartEmpty}>
                <div class="slds-align_absolute-center slds-text-color_weak">
                    No risk score data available for the selected period.
                </div>
            </template>

            <!-- Error Panel -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>Error loading chart data.</h2>
                    <p>{errorText}</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
