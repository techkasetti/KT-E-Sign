<template>
    <lightning-card title="Document Generator" icon-name="standard:document">
        <div class="slds-card__body slds-card__body_inner">
            
            <!-- Step Indicator -->
            <div class="step-indicator slds-m-bottom_medium">
                <lightning-progress-indicator 
                    current-step={currentStep} 
                    type="path" 
                    variant="base">
                    <lightning-progress-step label="Select Options" value="step-1"></lightning-progress-step>
                    <lightning-progress-step label="Document Details" value="step-2"></lightning-progress-step>
                    <lightning-progress-step label="Review & Generate" value="step-3"></lightning-progress-step>
                    <lightning-progress-step label="Request Signature" value="step-4"></lightning-progress-step>
                </lightning-progress-indicator>
            </div>

            <!-- Step 1: Selection Form -->
            <template if:true={isStep1}>
                <div class="selection-form">
                    <lightning-combobox
                        label="Region"
                        value={selectedRegion}
                        options={regionOptions}
                        onchange={handleRegionChange}
                        required>
                    </lightning-combobox>
                    
                    <lightning-combobox
                        label="Role"
                        value={selectedRole}
                        options={roleOptions}
                        onchange={handleRoleChange}
                        required>
                    </lightning-combobox>
                    
                    <lightning-combobox
                        label="Contract Type"
                        value={selectedContractType}
                        options={contractTypeOptions}
                        onchange={handleContractTypeChange}
                        required>
                    </lightning-combobox>
                </div>
                
                <div class="navigation-buttons slds-m-top_medium">
                    <lightning-button
                        variant="brand"
                        label="Next"
                        onclick={handleNext}
                        disabled={isNextDisabled}>
                    </lightning-button>
                </div>
            </template>

            <!-- Step 2: Document Details -->
            <template if:true={isStep2}>
                <lightning-input
                    type="text"
                    label="Document Title"
                    value={documentTitle}
                    onchange={handleTitleChange}
                    required>
                </lightning-input>
                
                <lightning-textarea
                    label="Additional Notes"
                    value={additionalNotes}
                    onchange={handleNotesChange}>
                </lightning-textarea>
                
                <div class="navigation-buttons slds-m-top_medium">
                    <lightning-button
                        variant="neutral"
                        label="Previous"
                        onclick={handlePrevious}
                        class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Next"
                        onclick={handleNext}
                        disabled={isNextDisabled}>
                    </lightning-button>
                </div>
            </template>

            <!-- Step 3: Review & Generate -->
            <template if:true={isStep3}>
                <div class="review-section">
                    <h3 class="slds-text-heading_small">Review Your Document:</h3>
                    <div class="slds-box slds-m-vertical_small">
                        <p><strong>Region:</strong> {selectedRegion}</p>
                        <p><strong>Role:</strong> {selectedRole}</p>
                        <p><strong>Contract Type:</strong> {selectedContractType}</p>
                        <p><strong>Title:</strong> {documentTitle}</p>
                    </div>
                    
                    Based on my analysis of the Developer_Build_Step_By_Step_Impl_E-Sign.docx document, I'll continue from where we left off and provide the complete implementation guide.
Continuing from Step 3.1: documentGenerator LWC HTML
<template if:true={generatedClause}>
    <div class="generated-clause slds-box slds-theme_shade slds-m-vertical_small">
        <h4 class="slds-text-heading_small">Generated Document Clause:</h4>
        <p class="generated-text">{generatedClause}</p>
        <template if:true={complianceStatus}>
            <div class={complianceStatusClass}>
                <lightning-icon icon-name={complianceIcon} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                <span>{complianceMessage}</span>
            </div>
        </template>
    </div>
</template>
            </div>
            
            <div class="navigation-buttons slds-m-top_medium">
                <lightning-button variant="neutral" label="Previous" onclick={handlePrevious} class="slds-m-right_small">
                </lightning-button>
                <lightning-button variant="brand" label="Generate Document" onclick={handleGenerateDocument} 
                                disabled={isGenerating}>
                </lightning-button>
                <template if:true={isGenerating}>
                    <lightning-spinner alternative-text="Generating..." size="small"></lightning-spinner>
                </template>
            </div>
        </template>

        <!-- Step 4: Signature Request -->
        <template if:true={isStep4}>
            <div class="signature-section">
                <template if:true={generatedDocumentId}>
                    <div class="slds-box slds-theme_success slds-m-bottom_medium">
                        <lightning-icon icon-name="utility:success" size="small" class="slds-m-right_small"></lightning-icon>
                        <span>Document generated successfully!</span>
                    </div>
                    
                    <h3 class="slds-text-heading_small">Request Signature</h3>
                    <lightning-input type="email" label="Signer Email" value={signerEmail} 
                                   onchange={handleSignerEmailChange} required>
                    </lightning-input>
                    <lightning-input type="text" label="Signer Name" value={signerName} 
                                   onchange={handleSignerNameChange} required>
                    </lightning-input>
                </template>
            </div>
            
            <div class="navigation-buttons slds-m-top_medium">
                <lightning-button variant="neutral" label="Previous" onclick={handlePrevious} class="slds-m-right_small">
                </lightning-button>
                <lightning-button variant="brand" label="Send Signature Request" onclick={handleSendSignatureRequest}
                                disabled={isSignatureRequestDisabled}>
                </lightning-button>
            </div>
        </template>
    </div>
</lightning-card>
</template>
