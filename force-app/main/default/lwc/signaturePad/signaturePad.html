<template>
    <lightning-card title="Electronic Signature" icon-name="standard:signature">
        <div class="slds-card__body slds-card__body_inner">
            
            <!-- Document Preview Section -->
            <div class="document-preview slds-box slds-m-bottom_medium">
                <h3 class="slds-text-heading_small">Document to Sign:</h3>
                <template if:true={documentContent}>
                    <div class="document-content">
                        <p><strong>Document ID:</strong> {recordId}</p>
                        <p><strong>Status:</strong> {signatureRequest.Status__c}</p>
                        <div class="document-text">
                            {documentContent}
                        </div>
                    </div>
                </template>
            </div>

            <!-- Signer Information -->
            <div class="signer-info slds-m-bottom_medium">
                <h3 class="slds-text-heading_small">Signer Information:</h3>
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-2 slds-p-right_small">
                        <lightning-input 
                            type="text" 
                            label="Full Name" 
                            value={signerName} 
                            onchange={handleSignerNameChange}
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input 
                            type="email" 
                            label="Email Address" 
                            value={signerEmail} 
                            onchange={handleSignerEmailChange}
                            required>
                        </lightning-input>
                    </div>
                </div>
            </div>

            <!-- Signature Method Selection -->
            <div class="signature-method slds-m-bottom_medium">
                <h3 class="slds-text-heading_small">Choose Signature Method:</h3>
                <lightning-radio-group 
                    name="signatureMethod" 
                    label="Signature Method" 
                    options={signatureMethodOptions} 
                    value={selectedSignatureMethod} 
                    onchange={handleSignatureMethodChange}>
                </lightning-radio-group>
            </div>

            <!-- Typed Signature -->
            <template if:true={isTypedSignature}>
                <div class="typed-signature slds-m-bottom_medium">
                    <lightning-input 
                        type="text" 
                        label="Type your full name as signature" 
                        value={typedSignature} 
                        onchange={handleTypedSignatureChange}
                        placeholder="Enter your full name">
                    </lightning-input>
                    <template if:true={typedSignature}>
                        <div class="signature-preview">
                            <p>Preview:</p>
                            <div class="typed-signature-display">{typedSignature}</div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Draw Signature -->
            <template if:true={isDrawSignature}>
                <div class="draw-signature slds-m-bottom_medium">
                    <p class="slds-m-bottom_small">Draw your signature in the box below:</p>
                    <div class="signature-canvas-container">
                        <canvas 
                            class="signature-canvas" 
                            width="400" 
                            height="200"
                            onmousedown={handleMouseDown}
                            onmousemove={handleMouseMove}
                            onmouseup={handleMouseUp}>
                        </canvas>
                    </div>
                    

<div class="canvas-controls slds-m-top_small">
    <lightning-button variant="neutral" label="Clear" onclick={handleClearCanvas}>
    </lightning-button>
</div>
</div>
</template>

<!-- Upload Signature -->
<template if:true={isUploadSignature}>
    <div class="upload-signature slds-m-bottom_medium">
        <lightning-file-upload
            label="Upload Signature Image"
            name="fileUploader"
            accept=".jpg.jpeg.png.gif"
            record-id={recordId}
            onuploadfinished={handleUploadFinished}
            multiple={false}>
        </lightning-file-upload>
        <template if:true={uploadedSignatureUrl}>
            <div class="uploaded-signature-preview slds-m-top_small">
                <p>Uploaded Signature Preview:</p>
                <img src={uploadedSignatureUrl} alt="Uploaded Signature" class="signature-image-preview"/>
            </div>
        </template>
    </div>
</template>

<!-- Agreement Checkbox -->
<div class="agreement-section slds-m-bottom_medium">
    <lightning-input 
        type="checkbox" 
        label="I agree to electronically sign this document and acknowledge that this signature is legally binding" 
        checked={hasAgreed} 
        onchange={handleAgreementChange}>
    </lightning-input>
</div>

<!-- Submit Button -->
<div class="submit-section">
    <lightning-button 
        variant="brand" 
        label="Submit Signature" 
        onclick={handleSubmitSignature} 
        disabled={isSubmitDisabled}
        class="slds-m-right_small">
    </lightning-button>
    <lightning-button 
        variant="neutral" 
        label="Cancel" 
        onclick={handleCancel}>
    </lightning-button>
    
    <template if:true={isSubmitting}>
        <lightning-spinner alternative-text="Submitting..." size="small"></lightning-spinner>
    </template>
</div>

</div>
</lightning-card>
</template>
