<template>
<lightning-card title="System Health Monitor" icon-name="standard:picklist_choice">
<div class="slds-card__body slds-card__body_inner">
<div class="health-overview slds-grid slds-gutters slds-m-bottom_large">
<div class="slds-col slds-size_1-of-3">
<div class="health-card slds-box slds-text-align_center {overallHealthClass}">
<lightning-icon icon-name={overallHealthIcon} size="large" variant={overallHealthVariant}></lightning-icon>
<h3 class="health-status-text">{overallHealthStatus}</h3>
<p class="health-score">Health Score: {overallHealthScore}%</p>
</div>
</div>

<div class="slds-col slds-size_2-of-3">
<div class="metrics-grid slds-grid slds-gutters slds-wrap">
<div class="slds-col slds-size_1-of-2">
<div class="mini-metric slds-box">
<div class="metric-header">
<lightning-icon icon-name="utility:clock" size="small"></lightning-icon>
<span class="metric-title">System Uptime</span>
</div>
<div class="metric-value">{systemUptime}%</div>
</div>
</div>

<div class="slds-col slds-size_1-of-2">
<div class="mini-metric slds-box">
<div class="metric-header">
<lightning-icon icon-name="utility:timer" size="small"></lightning-icon>
<span class="metric-title">Avg Response Time</span>
</div>
<div class="metric-value">{avgResponseTime}ms</div>
</div>
</div>

<div class="slds-col slds-size_1-of-2">
<div class="mini-metric slds-box">
<div class="metric-header">
<lightning-icon icon-name="utility:user" size="small"></lightning-icon>
<span class="metric-title">Active Sessions</span>
</div>
<div class="metric-value">{activeSessions}</div>
</div>
</div>

<div class="slds-col slds-size_1-of-2">
<div class="mini-metric slds-box">
<div class="metric-header">
<lightning-icon icon-name="utility:error" size="small"></lightning-icon>
<span class="metric-title">Error Rate</span>
</div>
<div class="metric-value">{errorRate}%</div>
</div>
</div>
</div>
</div>
</div>

<div class="performance-charts slds-grid slds-gutters slds-m-bottom_large">
<div class="slds-col slds-size_1-of-2">
<lightning-card title="Response Time Trends">
<div class="chart-container">
<canvas lwc:ref="responseChart" class="performance-chart"></canvas>
</div>
</lightning-card>
</div>

<div class="slds-col slds-size_1-of-2">
<lightning-card title="System Load">
<div class="chart-container">
<canvas lwc:ref="loadChart" class="performance-chart"></canvas>
</div>
</lightning-card>
</div>
</div>

<div class="system-alerts">
<lightning-card title="System Alerts">
<template if:true={hasAlerts}>
<div class="alerts-container">
<template for:each={systemAlerts} for:item="alert">
<div key={alert.id} class={alert.severityClass}>
<lightning-icon icon-name={alert.icon} size="small" variant={alert.iconVariant} class="slds-m-right_small"></lightning-icon>
<div class="alert-content">
<h4 class="alert-title">{alert.title}</h4>
<p class="alert-message">{alert.message}</p>
<p class="alert-time">{alert.timestamp}</p>
</div>
</div>
</template>
</div>
</template>
<template if:false={hasAlerts}>
<div class="no-alerts slds-text-align_center slds-p-around_medium">
<lightning-icon icon-name="utility:success" size="medium" variant="success" class="slds-m-bottom_small"></lightning-icon>
<p class="slds-text-heading_small">All Systems Operational</p>
<p class="slds-text-color_weak">No active alerts or issues detected</p>
</div>
</template>
</lightning-card>
</div>

<div class="performance-metrics slds-m-top_large">
<lightning-card title="Detailed Performance Metrics">
<template if:true={performanceMetrics}>
<lightning-datatable
key-field="id"
data={performanceMetrics}
columns={metricsColumns}
hide-checkbox-column="true">
</lightning-datatable>
</template>
</lightning-card>
</div>
</div>
</lightning-card>
</template>
